# 사이트 설정. 배포 전에 site.url 과 adsense 값을 실제 값으로 바꾸세요.
site:
  name: "머신러닝 경마연구소"
  tagline: "경마 통계 · 예상 · 적중률"
  # sitemap/canonical/OG 태그에 쓰인다. 자체 도메인을 붙이면 여기부터 바꾼다.
  url: "https://horse.koreanblog.xyz"
  locale: "ko_KR"
  # 적중률을 헤드라인으로 올리기 시작하는 경주 수 (개발 중 1)
  min_headline: 1
  description: "서울·부산경남·제주 경주의 출마표와 전적, 구간기록을 정리하고 경주별 예상을 공개합니다. 모든 예상은 발주 전에 게재하고 결과와 대조한 적중률을 그대로 공개합니다."
  author: "머신러닝 경마연구소"

# 애드센스. client 가 비어 있으면 광고 영역 자체가 렌더링되지 않습니다.
adsense:
  client: "ca-pub-4640178123605595"
  slot_top: "8186876073"
  slot_in_article: "5173699929"
  slot_bottom: "1855723286"

# 검색엔진 소유권 확인. 각 서비스에서 주는 content 값만 넣으면 된다.
# 비어 있으면 태그 자체가 나가지 않는다.
verification:
  google: ""    # 구글 서치콘솔 → HTML 태그 방식
  naver: "24fca955c9a60861e3eca05729750de66e490d58"

analytics:
  ga4_id: "G-2D35J53WMX"

build:
  # 개발 중에는 표본이 적어도 전부 보여 준다. 실제 방문자가 생기기 전이라
  # 얕은 표본의 백분율이 오해를 부를 일이 없고, 화면이 비어 있으면 만든 것을
  # 확인할 수가 없다. **출시 전에 반드시 되돌린다** — 첫 주말의 운 좋은 몇
  # 경주가 사이트 전체의 주장이 되면 곤란하다.
  min_sample: 1        # 출시 시 권장값: 그룹 20 · 등급 30 · 헤드라인 100
  # 상세 페이지를 만들 과거 경주 수 (지난 결과 아카이브)
  past_races: 300
  # 목록에 노출할 다가올 경주 최대 수
  upcoming_limit: 120
  # 마필 개별 페이지에 실을 최근 출주 수
  horse_form_limit: 20
