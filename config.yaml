# 사이트 설정. 배포 전에 site.url 과 adsense 값을 실제 값으로 바꾸세요.
site:
  name: "경마천재"
  tagline: "출마표 · 전적 · 예상"
  # sitemap/canonical/OG 태그에 쓰인다. 자체 도메인을 붙이면 여기부터 바꾼다.
  url: "https://horse.koreanblog.xyz"
  locale: "ko_KR"
  description: "서울·부산경남·제주 경주의 출마표와 전적, 구간기록을 정리하고 경주별 예상을 공개합니다. 모든 예상은 발주 전에 게재하고 결과와 대조한 적중률을 그대로 공개합니다."
  author: "경마천재"

# 애드센스. client 가 비어 있으면 광고 영역 자체가 렌더링되지 않습니다.
adsense:
  client: ""          # 예: ca-pub-0000000000000000
  slot_top: ""
  slot_in_article: ""
  slot_bottom: ""

analytics:
  ga4_id: ""          # 예: G-XXXXXXXXXX

build:
  # 상세 페이지를 만들 과거 경주 수 (지난 결과 아카이브)
  past_races: 300
  # 목록에 노출할 다가올 경주 최대 수
  upcoming_limit: 120
  # 마필 개별 페이지에 실을 최근 출주 수
  horse_form_limit: 20
