<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" fill="none"
     stroke="#1a6b4a" stroke-linecap="round" aria-hidden="true">
  <!-- 색은 파일 안에 박는다. 배경 이미지로 불러오면 바깥 CSS 의 color 가
       닿지 않아 currentColor 가 검정으로 떨어진다.
       주로를 위에서 내려다본 형태. 안쪽 레일부터 바깥까지 여섯 겹을 겹쳐
       거리 손실이 레인마다 다르다는 이 사이트의 관점을 그대로 그린다. -->
  <g stroke-width="1.1" opacity=".5">
    <rect x="150" y="120" width="600" height="180" rx="90"/>
    <rect x="132" y="102" width="636" height="216" rx="108"/>
    <rect x="114" y="84"  width="672" height="252" rx="126"/>
    <rect x="96"  y="66"  width="708" height="288" rx="144"/>
    <rect x="78"  y="48"  width="744" height="324" rx="162"/>
    <rect x="60"  y="30"  width="780" height="360" rx="180"/>
  </g>
  <!-- 결승선 -->
  <path d="M640 26 V394" stroke-width="2.4" opacity=".85"/>
</svg>
