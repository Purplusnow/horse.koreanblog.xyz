name: 포털 접근 진단

# GitHub 러너에서 공공데이터포털에 왜 못 닿는지 확인한다. 8/18~22 닷새 연속
# 출전표 수집이 ConnectTimeout 으로 죽었는데 같은 시각 로컬에서는 정상이다.
# 프록시를 세우기 전에 우회할 조건이 있는지부터 본다 — 조건 하나만 바꿔 되면
# 구조를 늘릴 이유가 없다.
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: 네트워크 조건별 시도
        env:
          KEY: ${{ secrets.KRA_SERVICE_KEY }}
        run: |
          H=apis.data.go.kr
          echo "── DNS ──"; getent hosts $H || echo "  해석 실패"
          echo
          echo "── TCP 443 ──"
          timeout 10 bash -c "cat < /dev/null > /dev/tcp/$H/443" \
            && echo "  연결 성공" || echo "  연결 실패"
          echo
          echo "── TCP 80 ──"
          timeout 10 bash -c "cat < /dev/null > /dev/tcp/$H/80" \
            && echo "  연결 성공" || echo "  연결 실패"
          echo
          U="https://$H/B551015/API26_2/entrySheet_2?serviceKey=$KEY&pageNo=1&numOfRows=1&_type=json&rc_date=20260822"
          for label in "기본" "브라우저 UA" "HTTP/1.1 고정" "IPv4 강제"; do
            case "$label" in
              "기본")        OPT="" ;;
              "브라우저 UA") OPT="-A Mozilla/5.0" ;;
              "HTTP/1.1 고정") OPT="--http1.1" ;;
              "IPv4 강제")   OPT="-4" ;;
            esac
            printf "── %s ── " "$label"
            curl -sS $OPT --max-time 25 -o /tmp/o -w "HTTP %{http_code} · 연결 %{time_connect}s · 총 %{time_total}s\n" "$U" \
              || echo "  실패"
            head -c 120 /tmp/o 2>/dev/null | tr -d '\n'; echo
          done

      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: 파이썬 클라이언트로 같은 요청
        env:
          KRA_SERVICE_KEY: ${{ secrets.KRA_SERVICE_KEY }}
        run: |
          pip -q install requests
          python - <<'PY'
          import os, time, requests
          key = os.environ["KRA_SERVICE_KEY"]
          url = "https://apis.data.go.kr/B551015/API26_2/entrySheet_2"
          q = {"serviceKey": key, "pageNo": 1, "numOfRows": 1,
               "_type": "json", "rc_date": "20260822"}
          for label, kw in (("Session 기본", {}),
                            ("trust_env=False", {"trust_env": False})):
              s = requests.Session()
              for k, v in kw.items():
                  setattr(s, k, v)
              t = time.time()
              try:
                  r = s.get(url, params=q, timeout=(6, 20))
                  print(f"  {label:<18} HTTP {r.status_code} · {time.time()-t:.2f}s "
                        f"· {r.text[:60]!r}")
              except Exception as e:
                  print(f"  {label:<18} 실패 {type(e).__name__} · {time.time()-t:.2f}s")
          print("  프록시 환경변수:",
                {k: v for k, v in os.environ.items() if "proxy" in k.lower()} or "없음")
          PY
