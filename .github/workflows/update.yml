name: 예상 갱신 및 배포

# 호출 주기는 '데이터가 언제 바뀌는가'에서 나온다. 시각은 UTC — KST = UTC+9.
#
#   출전표 · 경주결과 · 출주취소 → 날짜로 과거 조회가 되므로 몰아서 받으면 된다.
#     (취소 API 는 한 번 부르면 최근 한 달치를 함께 준다)
#   조교현황(API329)      → **가장 최근 조교일 하루치만** 응답한다. 날짜 파라미터가
#     없어 지나간 날은 다시 받을 수 없다. 이것 하나 때문에 매일 한 번은 돌아야 한다.
#
# 그래서 매일 아침 1회(전체 파이프라인) + 경주 당일 저녁 1회(결과 정산)로 잡는다.
# 6시간마다 돌던 이전 설정은 근거가 없었다 — 같은 데이터를 하루 네 번 받았다.
on:
  schedule:
    - cron: "0 0 * * *"        # 매일 09:00 KST — 조교 축적 · 출전표 · 예상 갱신
    - cron: "0 12 * * 5,6,0"   # 금·토·일 21:00 KST — 경주 결과 정산
  workflow_dispatch:
    inputs:
      retrain:
        description: "모델 재학습 강제 실행"
        type: boolean
        default: false
      backfill_years:
        description: "DB가 비었을 때 백필할 기간(년)"
        default: "5"

concurrency:
  group: horseai-update
  cancel-in-progress: false      # DB를 쓰므로 동시 실행 금지. 중간에 죽이면 안 된다.

permissions:
  contents: write                # 릴리스 자산으로 DB 보관
  pages: write
  id-token: write

env:
  DB: data/horseai.sqlite
  DB_RELEASE_TAG: db-state       # DB 스냅샷을 담아두는 릴리스 태그

jobs:
  update:
    runs-on: ubuntu-latest
    # deploy-pages 액션은 github-pages 환경을 요구한다. 없으면 배포 단계에서 실패한다.
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 의존성 설치
        run: pip install -r requirements.txt

      # --- 상태 복원 -------------------------------------------------------
      # Actions 는 무상태다. 예측 동결 규칙과 적중률 이력이 DB에 있으므로,
      # DB를 잃으면 사이트의 유일한 자산인 검증 기록이 사라진다.
      # git 에 커밋하면 바이너리 diff 로 저장소가 급격히 비대해지므로
      # 릴리스 자산으로 보관한다(압축 후 업로드, 매번 덮어쓰기).
      - name: DB 복원
        id: restore
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p data models
          if gh release download "$DB_RELEASE_TAG" -p "horseai.sqlite.zst" -D /tmp 2>/dev/null; then
            zstd -d /tmp/horseai.sqlite.zst -o "$DB"
            echo "restored=true" >> "$GITHUB_OUTPUT"
            echo "DB 복원 완료 ($(du -h "$DB" | cut -f1))"
          else
            echo "restored=false" >> "$GITHUB_OUTPUT"
            echo "기존 DB 없음 — 최초 백필을 수행합니다."
          fi
          gh release download "$DB_RELEASE_TAG" -p "model.joblib" -D models 2>/dev/null || true
          gh release download "$DB_RELEASE_TAG" -p "metrics.json" -D models 2>/dev/null || true

      # 진단 단계다. 예상 갱신에 필요한 건 아니고, 어떤 API 가 죽었는지 로그에
      # 남기는 용도다. 그런데 응답 없는 엔드포인트에서 재시도를 반복하며 22분을
      # 잡아먹고 배포 전체를 막은 적이 있다(14개 × 재시도 × 타임아웃).
      # 시간을 못 박고, 실패해도 배포를 세우지 않는다.
      - name: 엔드포인트 확인 (진단)
        continue-on-error: true
        timeout-minutes: 4
        env:
          KRA_SERVICE_KEY: ${{ secrets.KRA_SERVICE_KEY }}
        run: PYTHONPATH=src python -m horseai.kra.probe

      # --- 수집 ------------------------------------------------------------
      - name: 과거 성적 백필 (최초 1회)
        if: steps.restore.outputs.restored != 'true'
        env:
          KRA_SERVICE_KEY: ${{ secrets.KRA_SERVICE_KEY }}
        run: |
          PYTHONPATH=src python -m horseai.kra.collect backfill \
            --years "${{ inputs.backfill_years || '5' }}" --db "$DB"

      # 수집 실패가 배포를 막아서는 안 된다. 외부 API 가 잠깐 죽었다고 이미
      # 만들어 둔 예상까지 못 올리면, 정작 방문자가 필요할 때 사이트가 낡는다.
      # DB 는 그대로 보존되므로 다음 실행이 이어서 받는다.
      - name: 최근 성적 갱신
        continue-on-error: true
        timeout-minutes: 12
        env:
          KRA_SERVICE_KEY: ${{ secrets.KRA_SERVICE_KEY }}
        run: PYTHONPATH=src python -m horseai.kra.collect results --days 21 --db "$DB"

      # continue-on-error 를 뗀다. 다른 수집(성적·배당·조교)은 하루 빠져도
      # 다음 실행에서 메우면 되지만, 출전표가 없으면 그날 예상 자체가 없다.
      # 전량 실패면 collect 가 1 로 끝나므로 워크플로가 빨갛게 뜬다.
      #
      # 단계 전체를 시간 두고 다시 시도한다. 클라이언트에도 호출당 재시도가
      # 있지만(max_retries=4), 8/12·8/15 처럼 포털이 몇 분간 통째로 응답하지
      # 않으면 그 안에서 다 소진된다 — 15건이 전부 ConnectTimeout 이었다.
      # 5분 뒤에 다시 물어보면 두 번 다 풀렸으므로, 그 간격을 코드에 넣는다.
      - name: 출전표 수집
        timeout-minutes: 25
        env:
          KRA_SERVICE_KEY: ${{ secrets.KRA_SERVICE_KEY }}
        run: |
          for attempt in 1 2 3; do
            if PYTHONPATH=src python -m horseai.kra.collect entries --ahead 10 --db "$DB"; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "→ ${attempt}차 실패. 5분 뒤 다시 시도한다"
              sleep 300
            fi
          done
          echo "✗ 세 번 모두 실패 — 포털이 계속 응답하지 않는다"
          exit 1

      # 조교·마체중·출주취소는 '그 날에만' 값이 실리는 API 다. 하루를 놓치면
      # 그 하루는 영구히 복구할 수 없으므로, 실패해도 배포를 막지 않되(continue-on-error)
      # 매 실행마다 반드시 시도한다. 반년쯤 쌓이면 비공개 정보에 가장 가까운
      # 자산이 되고, 지금 시장을 못 이기는 격차를 좁힐 유일한 후보다.
      # 승식별 확정배당. 복승·쌍승·삼복승 배당은 여기에만 있고, 이것이 없으면
      # '우리 추천대로 샀다면 얼마가 됐나'를 답할 수 없다. 결과 수집 뒤에 온다.
      - name: 배당 수집
        timeout-minutes: 15
        continue-on-error: true
        env:
          KRA_SERVICE_KEY: ${{ secrets.KRA_SERVICE_KEY }}
        run: PYTHONPATH=src python -m horseai.kra.collect dividends --days 14 --db "$DB"

      - name: 조교 축적 (일별훈련)
        timeout-minutes: 12
        continue-on-error: true
        env:
          KRA_SERVICE_KEY: ${{ secrets.KRA_SERVICE_KEY }}
        run: PYTHONPATH=src python -m horseai.kra.collect training --train-days 7 --db "$DB"

      - name: 일일 데이터 축적 (조교·마체중·출주취소)
        timeout-minutes: 10
        continue-on-error: true
        env:
          KRA_SERVICE_KEY: ${{ secrets.KRA_SERVICE_KEY }}
        run: PYTHONPATH=src python -m horseai.kra.collect daily --db "$DB"

      # --- 학습 (주 1회: 월요일 03시 UTC, 또는 모델이 없을 때) ---------------
      - name: 재학습 필요 여부 판단
        id: need
        run: |
          # 보관된 모델을 실제로 열어 본다. 피클은 scikit-learn 버전이 어긋나면
          # 그대로 깨지는데(사설 클래스 소실), 그걸 예측 단계에서 처음 알면
          # 배포 전체가 멈춘다. 여기서 미리 확인하고 재학습으로 넘긴다.
          if [ -f models/model.joblib ] && \
             ! PYTHONPATH=src python -c "from horseai.model import load; load()" 2>/dev/null; then
            echo "::warning::보관된 모델을 읽지 못했습니다(의존성 버전 불일치 가능) → 재학습합니다"
            rm -f models/model.joblib
          fi
          if [ ! -f models/model.joblib ]; then
            echo "yes=true" >> "$GITHUB_OUTPUT"; echo "모델 없음 → 학습"
          elif [ "${{ inputs.retrain }}" = "true" ]; then
            echo "yes=true" >> "$GITHUB_OUTPUT"; echo "수동 요청 → 재학습"
          elif [ "$(date -u +%u)" = "1" ] && [ "$(date -u +%H)" = "00" ]; then
            echo "yes=true" >> "$GITHUB_OUTPUT"; echo "주간 일정 → 재학습"
          else
            echo "yes=false" >> "$GITHUB_OUTPUT"; echo "재학습 생략"
          fi

      - name: 모델 학습 및 검증
        if: steps.need.outputs.yes == 'true'
        run: |
          PYTHONPATH=src python -m horseai.model train --db "$DB" | tee models/report.txt

      - name: 누수 회귀 테스트
        if: steps.need.outputs.yes == 'true'
        run: |
          # 합성 픽스처로 '미래 정보가 피처에 새지 않는지'를 매 학습마다 확인한다.
          python tools/make_synth_db.py --db data/synth.sqlite --years 3
          python tests/test_no_leakage.py
          PYTHONPATH=src python tests/test_outcomes.py

      # 신뢰도 등급 경계는 모델 승률 분포에 붙어 있다. 재학습으로 분포가 바뀌면
      # 임계값도 같이 옮겨야 한 등급이 통째로 비는 일이 생기지 않는다.
      - name: 신뢰도 등급 재보정
        if: steps.need.outputs.yes == 'true'
        continue-on-error: true
        run: |
          PYTHONPATH=src python tools/calibrate_confidence.py \
            --db "$DB" --races 900 --sims 400 --save models/metrics.json

      # --- 예측 · 코멘트 · 검증 ---------------------------------------------
      - name: 예측 생성
        timeout-minutes: 20
        run: PYTHONPATH=src python -m horseai.predict --db "$DB"

      # 대본 형식이 바뀌어도 이미 시행된 경주는 예측을 다시 만들지 않으므로 옛
      # 대본이 남는다. 그러면 새 화면 코드가 읽을 값이 없어 미리보기가 깨진다.
      # 없으면 아무 일도 하지 않는 단계다. 게재한 예측은 건드리지 않는다.
      - name: 옛 미리보기 대본 재생성
        timeout-minutes: 20
        run: PYTHONPATH=src python -m horseai.predict --db "$DB" --rebuild-previews

      - name: AI 코멘트 생성
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: PYTHONPATH=src python -m horseai.comment --db "$DB" --limit 60

      # 자료가 있어야 할 자리에 있는지 센다. 성공한 파이프라인이 조용한 것은
      # 신호가 아니다 — 배당 7경주가 통째로 빠졌는데 모든 단계가 초록이었고,
      # 그 사이 공개 적중률이 실제의 3분의 1로 나가 있었다.
      - name: 자료 결손 점검
        run: PYTHONPATH=src python -m horseai.audit --db "$DB" --days 14 --strict

      - name: 적중률 검증
        run: PYTHONPATH=src python -m horseai.verify --db "$DB" --out data/accuracy.json

      # --- 빌드 · 배포 -------------------------------------------------------
      # 집계 결과를 저장소에 남긴다. 매 갱신의 diff 가 곧 '어제와 오늘 사이에
      # 무엇이 달라졌나' 의 기록이다. 배당이 늦게 들어와 숫자가 뛰는 것과
      # 모델이 무너져 내려앉는 것을 구분하려면 이 이력이 있어야 한다.
      - name: 집계 결과 기록
        continue-on-error: true
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/accuracy.json
          if git diff --cached --quiet; then
            echo "달라진 집계 없음"
          else
            git commit -q -m "집계 갱신 $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M') KST"
            git pull --rebase --autostash -q origin main
            git push -q origin HEAD:main && echo "기록 완료"
          fi

      - name: 사이트 빌드
        timeout-minutes: 15
        run: PYTHONPATH=src python -m horseai.site --db "$DB" --out dist

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v4

      # --- 상태 저장 --------------------------------------------------------
      # 반드시 마지막에. 앞 단계가 실패했어도 수집분은 보존해야 다음 실행이
      # 처음부터 다시 긁지 않는다 (always()).
      - name: DB 저장
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -f "$DB" ] || exit 0
          PYTHONPATH=src python -m horseai.kra.collect prune --db "$DB" --keep-days 180
          zstd -19 -f "$DB" -o /tmp/horseai.sqlite.zst
          gh release view "$DB_RELEASE_TAG" >/dev/null 2>&1 \
            || gh release create "$DB_RELEASE_TAG" --title "DB 스냅샷" \
                 --notes "자동 갱신되는 예측 DB. 수동으로 편집하지 마세요." --latest=false
          gh release upload "$DB_RELEASE_TAG" /tmp/horseai.sqlite.zst --clobber
          [ -f models/model.joblib ] && gh release upload "$DB_RELEASE_TAG" models/model.joblib --clobber || true
          [ -f models/metrics.json ] && gh release upload "$DB_RELEASE_TAG" models/metrics.json --clobber || true
          echo "저장 완료 ($(du -h /tmp/horseai.sqlite.zst | cut -f1) 압축)"

      - name: 요약
        if: always()
        run: |
          {
            echo "### 갱신 결과"
            echo '```'
            PYTHONPATH=src python -m horseai.kra.collect stats --db "$DB" 2>/dev/null || true
            echo '```'
            # `[ -f x ] && { ... }` 가 스크립트의 마지막 명령이면, 파일이 없을 때
            # 종료코드 1 이 그대로 남아 요약 단계 전체가 '실패'로 찍힌다.
            # 배포는 멀쩡한데 실행이 빨간색이 되어 진짜 실패를 가린다.
            if [ -f models/report.txt ]; then
              echo "### 모델 검증"; echo '```'; cat models/report.txt; echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
