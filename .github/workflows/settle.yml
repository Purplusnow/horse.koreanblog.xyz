name: 경주 결과 정산

# 경주가 끝나는 대로 결과를 반영한다.
#
# update.yml 로 이걸 하면 안 된다 — 배당 수집이 경마장·날짜당 최대 40페이지라
# 10분마다 돌리면 하루 수천 호출이 되고, 조교·출전표까지 매번 다시 받는다.
# 여기서는 **오늘 성적만** 받는다(경마장 3곳 = 3호출). 그 값으로 적중률을 다시
# 집계하고 사이트를 굽는다.
#
# **예측은 만들지 않는다.** 이미 게재한 예상을 건드릴 여지를 아예 두지 않는다.
# DB 도 저장하지 않는다 — 수집분은 저녁 파이프라인이 정식으로 갈무리하고,
# 여기서 쓰고 버리면 수집 파이프라인과 쓰기 충돌이 날 일이 없다.
#
# 갱신할 것이 없으면 아무것도 하지 않는다. 관문이 둘이다.
#
#   1. check — 게재본의 settle.json 만 읽는다(curl 한 번, 몇 초). 오늘 경주가
#      없거나 이미 다 정산됐으면 여기서 끝난다. 당일 경주가 모두 끝난 뒤부터
#      다음 날 첫 경주까지가 여기 걸린다.
#   2. 진척 확인 — 성적을 받아 본 뒤, 게재본보다 정산된 경주가 늘지 않았으면
#      빌드·배포를 건너뛴다. 경주와 경주 사이에 도는 실행이 여기 걸린다.
on:
  schedule:
    # 금·토·일 12:00~22:00 KST (UTC 03~13시) 10분마다.
    # GitHub 예약 실행은 부하에 따라 늦어질 수 있어 실제로는 10~20분 간격이 된다.
    - cron: "*/10 3-13 * * 5,6,0"
  workflow_dispatch:

concurrency:
  group: horseai-update      # 수집 파이프라인과 같은 그룹 — 겹쳐 돌지 않는다
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

env:
  DB: data/horseai.sqlite
  DB_RELEASE_TAG: db-state
  SITE_URL: https://horse.koreanblog.xyz

jobs:
  # 게재본 상태만 보고 할 일이 있는지 판단한다. 저장소도 받지 않고 파이썬도
  # 깔지 않는다 — 헛도는 실행의 비용을 curl 한 번으로 끝내는 것이 목적이다.
  check:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.gate.outputs.go }}
      was: ${{ steps.gate.outputs.was }}
    steps:
      - id: gate
        run: |
          today=$(TZ=Asia/Seoul date +%F)
          state=$(curl -fsS --max-time 20 "$SITE_URL/settle.json" || echo '{}')
          date=$(jq -r '.date // ""'   <<<"$state")
          total=$(jq -r '.total // 0'  <<<"$state")
          done_=$(jq -r '.settled // 0' <<<"$state")
          echo "오늘 $today · 게재본 $date ($done_/$total 정산)"

          # 게재본이 오늘 것이 아니면 오늘자 페이지 자체가 아직 안 올라갔다.
          # was=-1 로 두어 아래 진척 관문도 통과시킨다(정산 0경주여도 빌드해야
          # 오늘 경주 카드와 settle.json 이 올라간다).
          if [ "$date" != "$today" ]; then
            echo "→ 게재본이 오늘 것이 아니다. 진행한다"
            go=true; was=-1
          elif [ "$total" -eq 0 ]; then
            echo "→ 오늘은 경주가 없다. 건너뛴다"
            go=false; was=0
          elif [ "$done_" -ge "$total" ]; then
            echo "→ 오늘 $total 경주 모두 정산됐다. 건너뛴다"
            go=false; was="$done_"
          else
            echo "→ 미정산 $((total - done_))경주. 진행한다"
            go=true; was="$done_"
          fi
          { echo "go=$go"; echo "was=$was"; } >> "$GITHUB_OUTPUT"

  settle:
    needs: check
    if: needs.check.outputs.go == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: DB 복원
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p data models
          gh release download "$DB_RELEASE_TAG" -p "horseai.sqlite.zst" -D /tmp
          zstd -d /tmp/horseai.sqlite.zst -o "$DB"
          gh release download "$DB_RELEASE_TAG" -p "metrics.json" -D models 2>/dev/null || true

      - name: 오늘 성적 수집
        timeout-minutes: 8
        continue-on-error: true
        env:
          KRA_SERVICE_KEY: ${{ secrets.KRA_SERVICE_KEY }}
        run: PYTHONPATH=src python -m horseai.kra.collect results --days 1 --db "$DB"

      # 성적을 받아 봤더니 게재본과 같으면(경주와 경주 사이) 여기서 멈춘다.
      # 빌드가 이 워크플로에서 가장 오래 걸리는 단계라, 이 관문이 실효가 크다.
      - name: 정산 진척 확인
        id: prog
        env:
          WAS: ${{ needs.check.outputs.was }}
        run: |
          now=$(python - <<'PY'
          import datetime as dt, os, sqlite3
          kst = dt.timezone(dt.timedelta(hours=9))
          today = dt.datetime.now(dt.timezone.utc).astimezone(kst).date().isoformat()
          conn = sqlite3.connect(os.environ["DB"])
          print(conn.execute(
              "SELECT COUNT(DISTINCT r.race_key) FROM races r "
              "JOIN results s ON s.race_key = r.race_key AND s.ord = 1 "
              "WHERE r.rc_date = ?", (today,)).fetchone()[0])
          PY
          )
          echo "게재본 $WAS 경주 → 지금 $now 경주"
          if [ "$now" -gt "$WAS" ]; then
            echo "→ 새로 정산된 경주가 있다. 배포한다"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "→ 달라진 것이 없다. 배포하지 않는다"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      # 보관된 DB 의 미리보기 대본이 옛 형식일 수 있다. 대본 형식이 바뀌어도
      # 시행된 경주는 예측을 다시 만들지 않으므로 옛 값이 그대로 남고, 새 화면
      # 코드가 읽을 lanes 가 없어 말이 전부 0레인에 겹쳐 그려진다.
      # 여기서 다시 굽는다 — 게재한 승률·순위는 그대로 쓰므로 예상은 안 바뀐다.
      - name: 옛 미리보기 대본 재생성
        if: steps.prog.outputs.changed == 'true'
        timeout-minutes: 20
        run: PYTHONPATH=src python -m horseai.predict --db "$DB" --rebuild-previews

      # 정산 중에는 마사회가 1~3착만 낸 구간이 있어 결손이 정상일 수 있다.
      # 여기서는 빨갛게 띄우지 않고 기록만 남긴다 — 저녁 파이프라인이 판정한다.
      - name: 자료 결손 점검
        continue-on-error: true
        run: PYTHONPATH=src python -m horseai.audit --db "$DB" --days 3

      - name: 적중률 검증
        if: steps.prog.outputs.changed == 'true'
        run: PYTHONPATH=src python -m horseai.verify --db "$DB" --out data/accuracy.json

      - name: 사이트 빌드
        if: steps.prog.outputs.changed == 'true'
        timeout-minutes: 15
        run: PYTHONPATH=src python -m horseai.site --db "$DB" --out dist

      - uses: actions/configure-pages@v5
        if: steps.prog.outputs.changed == 'true'
      - uses: actions/upload-pages-artifact@v3
        if: steps.prog.outputs.changed == 'true'
        with:
          path: dist
      - id: deployment
        if: steps.prog.outputs.changed == 'true'
        uses: actions/deploy-pages@v4
